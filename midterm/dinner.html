  <main>
    <h2>晚餐慢慢吃</h2>
    <p>下面是四種適合晚餐的餐點，可以根據今天的心情選擇。</p>

    <div class="food-grid">
      <div class="food-card">
        <h3>火鍋</h3>
        <p>可以搭配肉片、青菜與火鍋料，適合天氣較冷的時候。</p>
        <p><strong>參考價格：</strong>NT$180～350</p>
      </div>

      <div class="food-card">
        <h3>義大利麵</h3>
        <p>有紅醬、青醬和白醬等不同口味，可以依喜好選擇。</p>
        <p><strong>參考價格：</strong>NT$150～280</p>
      </div>

      <div class="food-card">
        <h3>燒肉</h3>
        <p>適合和家人或朋友一起用餐，可以自己烤肉與蔬菜。</p>
        <p><strong>參考價格：</strong>NT$350～700</p>
      </div>

      <div class="food-card">
        <h3>炒飯</h3>
        <p>價格實惠、出餐速度快，是不知道吃什麼時的簡單選擇。</p>
        <p><strong>參考價格：</strong>NT$80～130</p>
      </div>
    </div>
  </main>

  <footer><p>今天吃什麼？數位美食指南</p></footer>
