<html>
<head>
    <title>Weekly Schedule</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #292929;
            background-color: #eeeeee;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(980px, calc(100% - 32px));
            margin: 48px auto;
            padding: 36px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin: 0 0 30px;
            text-align: center;
            font-size: clamp(2.2rem, 6vw, 4rem);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 680px;
            table-layout: fixed;
            border-spacing: 4px;
            background-color: #d8d8d8;
        }

        th,
        td {
            height: 64px;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
            background-color: #e8e8e8;
        }

        thead th {
            height: 70px;
            color: #ffffff;
            background-color: #333333;
            font-size: 1.1rem;
        }

        tbody th {
            width: 130px;
            background-color: #dddddd;
            font-weight: bold;
        }

        .breakfast {
            background-color: #f1eeee;
            font-weight: bold;
        }

        .business {
            background-color: #dcecb9;
        }

        .physics {
            background-color: #efc39d;
        }

        .math {
            background-color: #c9d8e7;
        }

        .course {
            font-weight: bold;
            line-height: 1.45;
        }

        @media (max-width: 640px) {
            main {
                width: 100%;
                margin: 0;
                padding: 24px 14px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Task 2</h1>

        <div class="table-wrapper">
            <table cellpadding="12" cellspacing="4">
                <thead>
                    <tr>
                        <th scope="col">Time</th>
                        <th scope="col">Mon</th>
                        <th scope="col">Tue</th>
                        <th scope="col">Wed</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">7:30 AM</th>
                        <td class="breakfast">Breakfast</td>
                        <td class="breakfast">Breakfast</td>
                        <td class="breakfast">Breakfast</td>
                    </tr>
                    <tr>
                        <th scope="row">8:00 AM</th>
                        <td class="business course" rowspan="2">Business: Lecture<br>Bldg B, Rm 256</td>
                        <td class="physics course" rowspan="3">Physics: Lab<br>Bldg J, Rm 309</td>
                        <td class="business course" rowspan="2">Business: Lecture<br>Bldg B, Rm 256</td>
                    </tr>
                    <tr>
                        <th scope="row">8:30 AM</th>
                    </tr>
                    <tr>
                        <th scope="row">9:00 AM</th>
                        <td class="math course" rowspan="2">Applied Math<br>Bldg H, Rm 100</td>
                        <td class="math course" rowspan="2">Applied Math<br>Bldg H, Rm 100</td>
                    </tr>
                    <tr>
                        <th scope="row">9:30 AM</th>
                        <td></td>
                    </tr>
                    <tr>
                        <th scope="row">10:00 AM</th>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <th scope="row">10:30 AM</th>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <th scope="row">11:00 AM</th>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <th scope="row">11:30 AM</th>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
