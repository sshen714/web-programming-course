<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Web Programming Course 作業入口網站">
    <title>Web Programming Course</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: #1f2937;
            background: #f4f6f8;
            font-family: Arial, "Noto Sans TC", sans-serif;
        }

        header {
            padding: 72px 24px 56px;
            color: #ffffff;
            text-align: center;
            background: #17324d;
        }

        header h1 {
            margin: 0 0 16px;
            font-size: clamp(2rem, 5vw, 3.5rem);
        }

        header p {
            max-width: 600px;
            margin: 0 auto;
            color: #dbe7f2;
            font-size: 1.1rem;
            line-height: 1.7;
        }

        main {
            width: min(960px, calc(100% - 40px));
            margin: 0 auto;
            padding: 48px 0 72px;
        }

        .section-heading {
            margin-bottom: 24px;
        }

        .section-heading h2 {
            margin: 0 0 8px;
            font-size: 1.75rem;
        }

        .section-heading p {
            margin: 0;
            color: #64748b;
        }

        .homework-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .homework-card {
            display: flex;
            flex-direction: column;
            min-height: 220px;
            padding: 28px;
            color: inherit;
            text-decoration: none;
            background: #ffffff;
            border: 1px solid #dce3ea;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(23, 50, 77, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .homework-card:hover,
        .homework-card:focus-visible {
            border-color: #2563a6;
            box-shadow: 0 12px 30px rgba(23, 50, 77, 0.14);
            transform: translateY(-4px);
        }

        .homework-card:focus-visible {
            outline: 3px solid rgba(37, 99, 166, 0.25);
            outline-offset: 3px;
        }

        .homework-number {
            margin-bottom: 24px;
            color: #2563a6;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.12em;
        }

        .homework-card h3 {
            margin: 0 0 12px;
            font-size: 1.35rem;
        }

        .homework-card p {
            margin: 0 0 24px;
            color: #64748b;
            line-height: 1.6;
        }

        .view-link {
            margin-top: auto;
            color: #17324d;
            font-weight: bold;
        }

        .empty-message {
            margin: 0;
            padding: 28px;
            color: #64748b;
            text-align: center;
            background: #ffffff;
            border: 1px dashed #b8c4d0;
            border-radius: 12px;
        }

        footer {
            padding: 24px;
            color: #64748b;
            text-align: center;
            border-top: 1px solid #dce3ea;
        }

        @media (max-width: 600px) {
            header {
                padding: 56px 20px 44px;
            }

            main {
                width: min(100% - 28px, 960px);
                padding-top: 36px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Web Programming Course</h1>
        <p>網頁程式設計課程的練習與作業入口</p>
    </header>

    <main>
        <section aria-labelledby="homework-title">
            <div class="section-heading">
                <h2 id="homework-title">Homework</h2>
                <p>點選作業卡片即可查看網頁內容。</p>
            </div>

            <div class="homework-list" id="homework-list"></div>

            <noscript>
                <p class="empty-message">請啟用 JavaScript 以查看作業清單。</p>
            </noscript>
        </section>
    </main>

    <footer>
        <p>sshen714 &middot; Web Programming Course</p>
    </footer>

    <script>
        // 之後新增作業時，只要在這個陣列中加入一筆資料。
        const homeworkData = [
            {
                number: "HW01",
                title: "My Favorite Planet",
                description: "練習 HTML 標題、段落、文字格式、上下標與縮寫標籤。",
                link: "./week1/1.html"
            },

             {
                number: "HW02",
                title: "Jazz Night 2026",
                description: "練習 HTML 文字格式、時間、圖片、連結與聯絡資訊元素。",
                link: "./week2/1.html"
            },

        ];

        

        const homeworkList = document.querySelector("#homework-list");

        function createHomeworkCard(homework) {
            const card = document.createElement("a");
            card.className = "homework-card";
            card.href = homework.link;
            card.setAttribute("aria-label", `查看 ${homework.number}：${homework.title}`);

            const number = document.createElement("span");
            number.className = "homework-number";
            number.textContent = homework.number;

            const title = document.createElement("h3");
            title.textContent = homework.title;

            const description = document.createElement("p");
            description.textContent = homework.description;

            const viewLink = document.createElement("span");
            viewLink.className = "view-link";
            viewLink.innerHTML = "查看作業 &rarr;";

            card.append(number, title, description, viewLink);
            return card;
        }

        if (homeworkData.length === 0) {
            const emptyMessage = document.createElement("p");
            emptyMessage.className = "empty-message";
            emptyMessage.textContent = "目前尚無作業。";
            homeworkList.append(emptyMessage);
        } else {
            const homeworkCards = document.createDocumentFragment();

            homeworkData.forEach((homework) => {
                homeworkCards.append(createHomeworkCard(homework));
            });

            homeworkList.append(homeworkCards);
        }
    </script>
</body>
</html>
