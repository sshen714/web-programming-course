<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Web Programming Course 作業入口網站">
    <title>Web Programming Course</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: #1f2937;
            background: #f4f6f8;
            font-family: Arial, "Noto Sans TC", sans-serif;
        }

        header {
            padding: 72px 24px 56px;
            color: #ffffff;
            text-align: center;
            background: #17324d;
        }

        header h1 {
            margin: 0 0 16px;
            font-size: clamp(2rem, 5vw, 3.5rem);
        }

        header p {
            max-width: 600px;
            margin: 0 auto;
            color: #dbe7f2;
            font-size: 1.1rem;
            line-height: 1.7;
        }

        main {
            width: min(960px, calc(100% - 40px));
            margin: 0 auto;
            padding: 48px 0 72px;
        }

        .section-heading {
            margin-bottom: 24px;
        }

        .section-heading h2 {
            margin: 0 0 8px;
            font-size: 1.75rem;
        }

        .section-heading p {
            margin: 0;
            color: #64748b;
        }

        .homework-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .homework-card {
            display: flex;
            flex-direction: column;
            min-height: 220px;
            padding: 28px;
            color: inherit;
            text-decoration: none;
            background: #ffffff;
            border: 1px solid #dce3ea;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(23, 50, 77, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .homework-card:hover,
        .homework-card:focus-visible {
            border-color: #2563a6;
            box-shadow: 0 12px 30px rgba(23, 50, 77, 0.14);
            transform: translateY(-4px);
        }

        .homework-card:focus-visible {
            outline: 3px solid rgba(37, 99, 166, 0.25);
            outline-offset: 3px;
        }

        .homework-number {
            margin-bottom: 24px;
            color: #2563a6;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.12em;
        }

        .homework-card h3 {
            margin: 0 0 12px;
            font-size: 1.35rem;
        }

        .homework-card p {
            margin: 0 0 24px;
            color: #64748b;
            line-height: 1.6;
        }

        .view-link {
            margin-top: auto;
            color: #17324d;
            font-weight: bold;
        }

        footer {
            padding: 24px;
            color: #64748b;
            text-align: center;
            border-top: 1px solid #dce3ea;
        }

        @media (max-width: 600px) {
            header {
                padding: 56px 20px 44px;
            }

            main {
                width: min(100% - 28px, 960px);
                padding-top: 36px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Web Programming Course</h1>
        <p>網頁程式設計課程的練習與作業入口</p>
    </header>

    <main>
        <section aria-labelledby="homework-title">
            <div class="section-heading">
                <h2 id="homework-title">Homework</h2>
                <p>點選作業卡片即可查看網頁內容。</p>
            </div>

            <div class="homework-list">
                <a class="homework-card" href="./1.html">
                    <span class="homework-number">HW01</span>
                    <h3>My Favorite Planet</h3>
                    <p>練習 HTML 標題、段落、文字格式、上下標與縮寫標籤。</p>
                    <span class="view-link">查看作業 &rarr;</span>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>sshen714 &middot; Web Programming Course</p>
    </footer>
</body>
</html>
