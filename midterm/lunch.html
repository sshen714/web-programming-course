  <main>
    <h2>今天午餐吃什麼？</h2>
    <p>下面是四種常見的午餐，可以根據預算和喜好選擇。</p>

    <div class="food-grid">
      <div class="food-card">
        <h3>排骨便當</h3>
        <p>排骨搭配白飯與配菜，餐點內容豐富又有飽足感。</p>
        <p><strong>參考價格：</strong>NT$90～130</p>
      </div>

      <div class="food-card">
        <h3>牛肉麵</h3>
        <p>燉煮的牛肉加上熱湯與麵條，適合想吃熱食的時候。</p>
        <p><strong>參考價格：</strong>NT$130～200</p>
      </div>

      <div class="food-card">
        <h3>咖哩飯</h3>
        <p>咖哩醬搭配白飯，可以選擇雞肉、豬排或蔬菜。</p>
        <p><strong>參考價格：</strong>NT$100～180</p>
      </div>

      <div class="food-card">
        <h3>水餃</h3>
        <p>可以自由決定數量，搭配酸辣湯就是簡單的午餐。</p>
        <p><strong>參考價格：</strong>NT$70～120</p>
      </div>
    </div>
  </main>

  <footer><p>今天吃什麼？數位美食指南</p></footer>
