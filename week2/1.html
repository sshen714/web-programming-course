<!DOCTYPE html>
<html>
<head>
    <title>Demo of link</title>
    <style>
    
        a:link{
        color:yellow;
        background-color: black;
        } 

        a:visited{
        color:grey;
        } 

        a:active{
        color:pink;
        background-color: yellow;
        }
        
        a:hover{
            color: rgb(0, 204, 255);
        }

    </style>
    
</head>
<body>
    <h1>Demo of link:</h1>  
    <a href="https://www.w3schools.com">Visit W3Schools </a>

</body>
</html>
