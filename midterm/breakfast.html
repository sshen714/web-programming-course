<!DOCTYPE html>
<html>
<head>
  <title>早餐推薦｜今天吃什麼？</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>早餐推薦</h1>
    <nav>
      <ul>
        <li><a href="index.html">首頁</a></li>
        <li><a href="breakfast.html">早餐</a></li>
        <li><a href="lunch.html">午餐</a></li>
        <li><a href="dinner.html">晚餐</a></li>
        <li><a href="drinks.html">飲料</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>充滿活力的早餐</h2>
    <p>下面是四種常見又方便的早餐選擇。</p>

    <div class="food-grid">
      <div class="food-card">
        <img src="images/egg-pancake.svg" alt="蛋餅">
        <h3>蛋餅</h3>
        <p>外皮微脆，加上雞蛋後簡單又有飽足感。</p>
      </div>

      <div class="food-card">
        <img src="images/toast.svg" alt="吐司">
        <h3>吐司</h3>
        <p>可以夾蛋、起司或火腿，適合趕時間的早晨。</p>
      </div>

      <div class="food-card">
        <img src="images/rice-ball.svg" alt="飯糰">
        <h3>飯糰</h3>
        <p>糯米包入油條、肉鬆等配料，吃完很有飽足感。</p>
      </div>

      <div class="food-card">
        <img src="images/noodles.svg" alt="鐵板麵">
        <h3>鐵板麵</h3>
        <p>麵條搭配蘑菇醬或黑胡椒醬，是較份量十足的選擇。</p>
      </div>
    </div>
  </main>

  <footer><p>今天吃什麼？數位美食指南</p></footer>
</body>
</html>
