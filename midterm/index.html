<!DOCTYPE html>
<html>
<head>
  <title>今天吃什麼？</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>今天吃什麼？</h1>
    <nav>
      <ul>
        <li><a href="index.html">首頁</a></li>
        <li><a href="breakfast.html">早餐</a></li>
        <li><a href="lunch.html">午餐</a></li>
        <li><a href="dinner.html">晚餐</a></li>
        <li><a href="drinks.html">飲料</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>今天不知道吃什麼嗎？</h2>
    <p>先選擇一個主題，再讓輪盤幫你決定今天吃什麼。</p>

    <div class="topic-selector">
      <label for="topic">選擇主題：</label>
      <select id="topic">
        <option value="breakfast">早餐</option>
        <option value="lunch">午餐</option>
        <option value="dinner">晚餐</option>
        <option value="drinks">飲料</option>
      </select>
    </div>

    <div class="wheel-wrapper">
      <div class="wheel-pointer"></div>
      <div class="wheel-placeholder" id="wheel">
        <ul id="menu-list"></ul>
      </div>
    </div>

    <button type="button" id="spin-button">轉動輪盤</button>
    <p id="result" aria-live="polite">選擇結果會顯示在這裡</p>
  </main>

  <footer>
    <p>今天吃什麼？數位美食指南</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
